name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON (configs + task cards)
        shell: pwsh
        run: |
          $files = @(Get-ChildItem wise-counsel/config/*.json) + @(Get-ChildItem eval/*.json) + @(Get-ChildItem eval/tasks/*.json -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { "no JSON found"; exit 1 }
          foreach ($f in $files) { Get-Content $f.FullName -Raw | ConvertFrom-Json | Out-Null }
          "JSON-OK ($($files.Count) files)"

      - name: Lint (PSScriptAnalyzer)
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          }
          $r = Invoke-ScriptAnalyzer -Path . -Settings ./PSScriptAnalyzerSettings.psd1 -Recurse
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }

      - name: Installer smoke (offline, runner-home only)
        shell: pwsh
        run: pwsh -NoProfile -File wise-counsel/scripts/Install-WiseCounsel.ps1 -OpenCode -Claude -SkipValidation

      - name: Eval dry-run (offline end-to-end, zero spend)
        shell: pwsh
        run: pwsh -NoProfile -File eval/Invoke-DryRunSmoke.ps1
